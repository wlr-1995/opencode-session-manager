appId: com.opencode.session-manager
productName: OpenCodeSessionManager
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - build/icon.png

extraResources:
  - from: src/helper/db-helper.mjs
    to: db-helper.mjs

asar: true

win:
  extraResources:
    - from: resources/node.exe
      to: node.exe
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

linux:
  target:
    - target: AppImage
  category: Development
  icon: build/icon.png
  executableName: opencode-session-manager
  syncDesktopName: true
  artifactName: "${productName}-${version}-${arch}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: OpenCode 会话管理器
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: "${productName}-Setup-${version}.${ext}"

portable:
  artifactName: "${productName}-Portable-${version}.${ext}"

electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
